<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>騙騙不信 | 沉浸式防詐對戰</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #F43F5E;
            --primary-hover: #E11D48;
            --bg-color: #0F172A;
            --panel-bg: rgba(15, 23, 42, 0.4);
            --border-color: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            color: #F8FAFC;
            overflow: hidden;
            /* 全螢幕無滾動 */
        }

        /* 導覽列 (Top Navbar) */
        nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            z-index: 50;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: white;
            display: flex;
            align-items: center;
            text-decoration: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #CBD5E1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(4px);
            letter-spacing: 1px;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
        }

        /* 全螢幕 Avatar (底層) */
        .avatar-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: radial-gradient(circle at center, #1E293B 0%, #0F172A 100%);
        }

        sv-presenter {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            z-index: 10;
        }

        #damage-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(239, 68, 68, 0.7) 120%);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s;
        }

        #victory-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 30%, rgba(16, 185, 129, 0.7) 120%);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: opacity 0.3s;
        }

        .damage-flash #damage-overlay {
            opacity: 1;
            transition: opacity 0.1s;
        }

        .victory-flash #victory-overlay {
            opacity: 1;
            transition: opacity 0.1s;
        }

        /* HUD 層 (遊戲化介面) */
        .hud-layer {
            position: absolute;
            inset: 0;
            top: 70px;
            pointer-events: none;
            z-index: 30;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            /* 允許點擊 */
        }

        /* 雙方對戰 VS 血條 (頭部) */
        .vs-hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 850px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .hp-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .user-side {
            text-align: left;
            margin-right: 30px;
        }

        .ai-side {
            text-align: right;
            margin-left: 30px;
        }

        .hp-label {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 1.1rem;
            color: #E2E8F0;
            text-shadow: 0 1px 2px #000;
        }

        .hp-bar-bg {
            background: rgba(0, 0, 0, 0.7);
            height: 22px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.6);
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.3);
        }

        .hp-user-fill {
            background: linear-gradient(90deg, #3B82F6, #60A5FA);
        }

        .hp-ai-fill {
            background: linear-gradient(90deg, #F59E0B, #FBBF24);
            transform-origin: right;
            float: right;
        }

        .hp-user-fill.danger,
        .hp-ai-fill.danger {
            background: linear-gradient(90deg, #EF4444, #F87171);
            animation: pulse-danger 1s infinite alternate;
        }

        .vs-badge {
            font-size: 2.2rem;
            font-weight: 900;
            font-style: italic;
            color: #F43F5E;
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.8), 2px 2px 0 #000;
            margin: 0 10px;
            line-height: 1;
        }

        /* 左側解析儀 */
        .analyzer-panel {
            position: absolute;
            top: 120px;
            left: 40px;
            width: 420px;
            max-height: calc(100vh - 180px);
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .analyzer-panel::-webkit-scrollbar {
            display: none;
        }

        .analyzer-header {
            font-weight: 900;
            font-size: 1.25rem;
            color: #38BDF8;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .analyzer-content {
            background: rgba(0, 0, 0, 0.5);
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #94A3B8;
            display: flex;
            align-items: flex-start;
            transition: 0.3s;
            border-left: 5px solid transparent;
        }

        .analyzer-content.scanning {
            color: #38BDF8;
            border-color: #38BDF8;
            animation: pulse 2s infinite;
        }

        .analyzer-content.alert-warning {
            background: rgba(245, 158, 11, 0.2);
            border-color: #F59E0B;
            color: #FDE68A;
        }

        .analyzer-content.alert-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: #EF4444;
            color: #FECACA;
        }

        /* 右側巨型對話框 (無底框，純透明容器) */
        .chat-panel {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 600px;
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: none;
        }

        .chat-log {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            /* 隱藏滾動條但保持滾動 */
        }

        .chat-log::-webkit-scrollbar {
            display: none;
        }

        /* Message Bubbles 帶有玻璃擬態 */
        .chat-message {
            max-width: 85%;
            padding: 16px 22px;
            border-radius: 20px;
            font-size: 1.15rem;
            line-height: 1.5;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            word-wrap: break-word;
            position: relative;
            pointer-events: auto;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .chat-message.user {
            align-self: flex-end;
            background: rgba(59, 130, 246, 0.8);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-message.assistant {
            align-self: flex-start;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-bottom-left-radius: 4px;
        }

        /* Input 表單的玻璃擬態設計 */
        .chat-form {
            display: flex;
            padding: 15px 20px;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            pointer-events: auto;
            align-items: center;
            margin-top: 15px;
            margin-right: 10px;
            margin-left: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 10px 15px;
            border: none;
            background: transparent;
            color: white;
            font-size: 1.15rem;
            outline: none;
        }

        .chat-input::placeholder {
            color: #CBD5E1;
        }

        .mic-btn,
        .send-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .mic-btn {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .mic-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .mic-btn.recording {
            background: #EF4444;
            color: white;
            animation: pulse 1.5s infinite;
            border-color: #EF4444;
        }

        .send-btn {
            background: var(--primary);
            color: white;
        }

        .send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        /* 動畫 */
        @keyframes pulse-danger {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.7;
            }
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes popUpFade {
            0% {
                transform: translate(-50%, -50%) translateY(20px) scale(0.5);
                opacity: 0;
            }

            10% {
                transform: translate(-50%, -50%) translateY(-10px) scale(1.1);
                opacity: 1;
            }

            80% {
                transform: translate(-50%, -50%) translateY(-40px) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) translateY(-80px) scale(1.05);
                opacity: 0;
            }
        }

        .floating-text {
            position: fixed;
            font-size: 2.2rem;
            font-weight: 900;
            pointer-events: none;
            z-index: 9999;
            left: 50%;
            top: 50%;
            animation: popUpFade 2.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
        }

        .float-dmg {
            color: #EF4444;
        }

        .float-heal {
            color: #3B82F6;
            font-size: 1.8rem;
        }

        .float-dmg-ai {
            color: #10B981;
            font-size: 2rem;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-15px) rotate(-1deg);
            }

            40%,
            80% {
                transform: translateX(15px) rotate(1deg);
            }
        }

        .shake-active {
            animation: shake 0.4s;
        }
    </style>
</head>

<body>
    <nav>
        <a href="index.html" class="logo">
            <img src="images/騙騙不信logo.png"
                style="height:42px; border-radius:6px; box-shadow:0 2px 5px rgba(255,94,98,0.3); margin-right:12px;">
            騙騙不信
        </a>
        <div class="controls">
            <button class="tab-btn active" data-id="01M15VG6NTAY7TR8BD8EWQNJG7"
                data-avatar-id="01K4M8SH17VHBRTXWEB2KKYPCS" data-scene-id="01KWVBXE9Q9CZ9FENATQHZYXJV"
                data-voice-id="0000000000B22N2X7KNEX7FNJ9">電商詐騙</button>
            <button class="tab-btn" data-id="01M15VH86B8N19MKC71SD6X8Y4" data-avatar-id="01K4M8R1PK54ATSP7ZWSX475B9"
                data-scene-id="01KWVBVQBZ5FV2BYKDTQ40V9AF" data-voice-id="0000000000JP6G4FH70VQ22FBW">電話投資詐騙</button>
            <button class="tab-btn" data-id="01M15VKVVYENG4HFDH48Q712D9" data-avatar-id="01K4M8T4RF9HTYE1W0M0957VSJ"
                data-scene-id="01KQEJD0NJFVM20M588K7D1E9Z" data-voice-id="0000000000RK4PMDRHPG2VT607">路邊推銷</button>
            <button class="tab-btn" data-id="01M15VMYRFZKAZPKH7NZT2BKN5" data-avatar-id="01K4M8TKBRTP4R1Z8TFGB5MYZN"
                data-scene-id="01KQEJCMFDVZDHYE3RVV2XHPK3" data-voice-id="01KVAGZWYB22WP19M8M5Z7SKRG">熟人多層次傳銷</button>
        </div>
    </nav>

    <!-- 全螢幕 Avatar (底層) -->
    <div class="avatar-layer" id="main-avatar-layer">
        <sv-presenter></sv-presenter>
        <div id="loading-overlay">連線至 Connect API...</div>
        <div id="damage-overlay"></div>
        <div id="victory-overlay"></div>
    </div>

    <!-- HUD 介面層 -->
    <div class="hud-layer">
        <!-- 頂部血條對決 HUD -->
        <div class="vs-hud">
            <!-- 玩家血條 -->
            <div class="hp-side user-side">
                <div class="hp-label"><span><i class="fa-solid fa-brain"></i> 防禦理智線 (您)</span> <span
                        id="hp-user-text">100 / 100</span></div>
                <div class="hp-bar-bg">
                    <div class="hp-bar-fill hp-user-fill" id="hp-user-fill"></div>
                </div>
            </div>

            <div class="vs-badge">VS</div>

            <!-- 詐騙集團血條 -->
            <div class="hp-side ai-side">
                <div class="hp-label"><span><span id="hp-ai-text">100 / 100</span> (騙子) 耐心值 <i
                            class="fa-solid fa-mask"></i></span></div>
                <div class="hp-bar-bg">
                    <div class="hp-bar-fill hp-ai-fill" id="hp-ai-fill"></div>
                </div>
            </div>
        </div>

        <!-- 左側 HUD -->
        <div class="analyzer-panel glass-panel">
            <div class="analyzer-header"><i class="fa-solid fa-radar fa-spin-pulse"></i> 心理戰術解析儀</div>
            <div class="analyzer-content scanning" id="analyzer-content">
                <i class="fa-solid fa-spinner fa-spin"></i> 監聽敵方程式中... 尚未發現新話術。
            </div>
        </div>

        <!-- 右側大型對話框 (無底框版) -->
        <div class="chat-panel">
            <div class="chat-log" id="chat-log"></div>
            <form class="chat-form" id="chat-form">
                <button type="button" id="mic-btn" class="mic-btn" title="語音輸入"><i
                        class="fa-solid fa-microphone"></i></button>
                <input type="text" id="chat-input" class="chat-input" placeholder="對抗詐騙！請輸入您的回應..." autocomplete="off">
                <button type="submit" id="chat-send-btn" class="send-btn"><i
                        class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script type="module">
        let currentChatbotId = "";
        let currentAvatarId = "";
        let audioUnlocked = false;
        const history = [];

        const presenter = document.querySelector("sv-presenter");
        const chatLog = document.getElementById("chat-log");
        const chatForm = document.getElementById("chat-form");
        const chatInput = document.getElementById("chat-input");
        const micBtn = document.getElementById("mic-btn");
        const loading = document.getElementById("loading-overlay");

        // ---------------- 遊戲化狀態與控制 ----------------
        let playerHP = 100;
        let aiHP = 100;
        let gameOver = false;

        function updateGameUI() {
            const hpUserFill = document.getElementById("hp-user-fill");
            const hpUserText = document.getElementById("hp-user-text");
            const hpAiFill = document.getElementById("hp-ai-fill");
            const hpAiText = document.getElementById("hp-ai-text");

            playerHP = Math.max(0, Math.min(100, playerHP));
            aiHP = Math.max(0, Math.min(100, aiHP));

            hpUserText.innerText = `${playerHP} / 100`;
            hpUserFill.style.width = `${playerHP}%`;
            hpUserFill.className = "hp-bar-fill hp-user-fill";
            if (playerHP <= 30) hpUserFill.classList.add("danger");

            hpAiText.innerText = `${aiHP} / 100`;
            hpAiFill.style.width = `${aiHP}%`;
            hpAiFill.className = "hp-bar-fill hp-ai-fill";
            if (aiHP <= 30) hpAiFill.classList.add("danger");

            if (playerHP === 0 && !gameOver) {
                gameOver = true;
                spawnFloatingText("💥 遭遇洗腦，防線崩潰！", "float-dmg");
                setTimeout(() => {
                    alert("☠️ 演練結束！\\n您的理智線已歸零，成功被詐騙集團洗腦脫產！請牢記這次的教訓，重整網頁再來一次。");
                }, 1500);
            } else if (aiHP === 0 && !gameOver) {
                gameOver = true;
                const phone = document.getElementById("main-avatar-layer");
                phone.classList.add("shake-active", "victory-flash");
                spawnFloatingText("🛡️ 成功識破詐騙！", "float-dmg-ai");
                setTimeout(() => {
                    alert("🎉 恭喜！\\n您成功耗盡了詐騙集團的耐心，識破了騙局！防禦大腦免疫力升級！");
                }, 1500);
            }
        }

        function spawnFloatingText(text, styleClass) {
            const el = document.createElement("div");
            el.className = `floating-text ${styleClass}`;
            el.innerHTML = text;

            // All text centered in fullscreen HUD with random offset
            el.style.left = `calc(50% + ${Math.random() * 80 - 40}px)`;
            el.style.top = `calc(50% + ${Math.random() * 80 - 40}px)`;

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function takeDamage(amount) {
            if (playerHP <= 0 || gameOver) return;
            playerHP -= amount;
            const phone = document.getElementById("main-avatar-layer");
            phone.classList.add("shake-active", "damage-flash");
            setTimeout(() => phone.classList.remove("shake-active", "damage-flash"), 400);
            spawnFloatingText(`-${amount} 理智傷害`, "float-dmg");
            updateGameUI();
        }

        function takeDamageAI(amount) {
            if (aiHP <= 0 || gameOver) return;
            aiHP -= amount;
            spawnFloatingText(`-${amount} 騙子耐心降低`, "float-dmg-ai");
            updateGameUI();
        }

        function healHP(amount) {
            if (playerHP >= 100 || gameOver) return;
            playerHP += amount;
            spawnFloatingText(`+${amount} 恢復理智`, "float-heal");
            updateGameUI();
        }

        function appendMessage(role, text) {
            const el = document.createElement("div");
            el.className = `chat-message ${role}`;
            el.innerText = text;
            chatLog.appendChild(el);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        async function request(path, body) {
            const res = await fetch(path, body && {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.details ?? data.error ?? res.statusText);
            return data;
        }

        // 綁定所有 Tab 按鈕 (切換情境模式與角色)
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                const target = e.target;
                target.classList.add('active');

                const newId = target.getAttribute('data-id');
                const avatarId = target.getAttribute('data-avatar-id');
                const sceneId = target.getAttribute('data-scene-id');
                const voiceId = target.getAttribute('data-voice-id');

                currentChatbotId = newId;
                currentAvatarId = avatarId;

                // 重置遊戲狀態
                playerHP = 100; aiHP = 100; gameOver = false;
                chatLog.innerHTML = ""; history.length = 0;
                updateGameUI();

                loading.style.display = "flex";
                loading.innerText = "切換情境中...";

                try {
                    const { connect_key } = await request("/api/connect-key");
                    const overrides = {};
                    if (avatarId) overrides.avatarId = avatarId;
                    if (sceneId) overrides.sceneId = sceneId;
                    if (voiceId) overrides.voiceId = voiceId;

                    // 確保 Web Component 已初始化
                    await customElements.whenDefined("sv-presenter");
                    await presenter.initializeWithConnectKey(connect_key, overrides);
                } catch (err) {
                    console.error("切換角色失敗:", err);
                    loading.innerText = "切換失敗，請重試。";
                }
            });
        });

        // 啟動與連線機制
        async function start() {
            try {
                const cfg = await request("/api/config");
                await new Promise((resolve) => {
                    const script = document.createElement("script");
                    script.type = "module";
                    script.src = cfg.presenterUrl;
                    script.onload = resolve;
                    document.head.append(script);
                });

                presenter.addEventListener("PRESENTER_STATUS", (e) => {
                    if (e.detail?.status === "Ready") {
                        loading.style.display = "none";
                        if (history.length === 0) {
                            appendMessage("assistant", "系統連線成功，請開始您的防詐測試。");
                        }
                    }
                });

                const { connect_key } = await request("/api/connect-key");
                const defaultBtn = document.querySelector('.tab-btn.active');
                currentChatbotId = defaultBtn ? defaultBtn.getAttribute('data-id') : cfg.chatbotId;

                const overrides = {};
                if (defaultBtn) {
                    const avatarId = defaultBtn.getAttribute('data-avatar-id');
                    const sceneId = defaultBtn.getAttribute('data-scene-id');
                    const voiceId = defaultBtn.getAttribute('data-voice-id');
                    if (avatarId) {
                        overrides.avatarId = avatarId;
                        currentAvatarId = avatarId;
                    }
                    if (sceneId) overrides.sceneId = sceneId;
                    if (voiceId) overrides.voiceId = voiceId;
                }

                // 等待元件正式註冊完成
                await customElements.whenDefined("sv-presenter");

                await presenter.initializeWithConnectKey(connect_key, overrides);
            } catch (err) {
                console.error(err);
                loading.textContent = "連線失敗：" + (err.message || "未知錯誤");
            }
        }
        start();

        // 語音輸入機制 (Web Speech API)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = false;
            let isRecording = false;

            micBtn.addEventListener("click", () => {
                if (isRecording) {
                    recognition.stop();
                } else {
                    recognition.start();
                    micBtn.classList.add("recording");
                    isRecording = true;
                }
            });

            recognition.addEventListener("result", (e) => {
                const transcript = e.results[0][0].transcript;
                chatInput.value += transcript;
            });
            recognition.addEventListener("end", () => {
                micBtn.classList.remove("recording");
                isRecording = false;
            });
            recognition.addEventListener("error", (e) => {
                console.error("語音辨識錯誤:", e);
                micBtn.classList.remove("recording");
                isRecording = false;
            });
        } else {
            micBtn.style.display = 'none';
        }

        function injectMotions(text, avatarId) {
            const isMale = (avatarId === "01K4M8SH17VHBRTXWEB2KKYPCS");
            const maleMotions = ["01KZAHJ8A3E35AC9R2HWWS46W3", "01KZDY5TMKCP4HMNQRG8W2CDD6", "01KZDY68V5VZ936C1Q6XPG9ZDE"]; // 一般講話
            const maleReject = ["01K4M9DKBV170XAB1VPAZSATS7"]; // 阻擋/不要
            const malePlead = ["01KZAHAF8ZNKD3NQHZAXBZTK4Y", "01KZAHJRBV69FA5VSDYWZGZX3H"]; // 懇求/抱歉

            const femaleMotions = ["01KZD8DV4YAJWN1PWX1RF0AYFB", "01KZDY3AD23WVRXG5EBVGYGFHM", "01KZD8EQV7Z1SF0BCTZEWTPTEV"]; // 一般講話
            const femaleReject = ["01K4M91D724K2DRSBFNW8EBPFA", "01K4M966TXRHH1GD1019WK8J0N"]; // 阻擋/搖頭
            const femalePlead = ["01K4M91VHDN3YKF2SN10DRR6JR", "01K4M99YW0BDQZ8ZC668VXG1KA"]; // 懇求/抱歉

            const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

            return text.split(/([。！？,，])/).reduce((acc, part) => {
                if (!part.trim() || /^[。！？,，]$/.test(part)) return acc + part;

                let intent = "talk";
                if (/(不是|聽我說|不要|誤會|怎麼可能|這不是|沒騙你)/.test(part)) intent = "reject";
                else if (/(拜託|幫個忙|求求|不好意思|保證|抱歉|真的)/.test(part)) intent = "plead";

                let selectedId;
                if (isMale) {
                    if (intent === "reject") selectedId = getRandom(maleReject);
                    else if (intent === "plead") selectedId = getRandom(malePlead);
                    else selectedId = getRandom(maleMotions);
                } else {
                    if (intent === "reject") selectedId = getRandom(femaleReject);
                    else if (intent === "plead") selectedId = getRandom(femalePlead);
                    else selectedId = getRandom(femaleMotions);
                }

                return acc + ` [MOTION ${selectedId}:1] ` + part;
            }, "");
        }

        // 發送聊天訊息
        chatForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !currentChatbotId || gameOver) return;

            chatInput.value = "";
            appendMessage("user", text);
            history.push({ role: "user", text });

            // 玩家主動回應時，合理扣減敵方耐心值 (根據句子長度和亂數)
            let damageToAI = Math.floor(Math.random() * 10) + (text.length > 5 ? 10 : 5);
            if (/(詐騙|騙人|騙子|報警|警察|165|不信|假|告你)/.test(text)) {
                damageToAI += 30; // 玩家直接點破，爆擊！
                spawnFloatingText("⚔️ 識破攻擊！爆擊！", "float-heal");
            }
            takeDamageAI(damageToAI);

            presenter.setThinking?.(true);

            if (!audioUnlocked) {
                await presenter.resumeAudioPlayback?.();
                audioUnlocked = true;
            }

            try {
                const data = await request(`/api/chatbots/${currentChatbotId}/chat`, {
                    messages: history.map(h => ({ role: h.role, parts: [{ type: "text", text: h.text }] }))
                });

                if (data.reply_text) {
                    history.push({ role: "assistant", text: data.reply_text });
                    const motionText = injectMotions(data.reply_text, currentAvatarId);
                    await presenter.present(motionText);
                    appendMessage("assistant", data.reply_text);
                    presenter.setThinking?.(false);

                    // 執行語意流氓戰術解析 (開頭幾句不痛下殺手)
                    analyzeTactic(data.reply_text, history.length > 2);
                }
            } catch (err) {
                appendMessage("assistant", "（系統錯誤：無法連接至機器人）");
                presenter.setThinking?.(false);
            }
        });

        // ---------------- 話術解析邏輯 (AI 動態即時生成版) ----------------
        function analyzeTactic(text, applyGameplay = true) {
            const analyzer = document.getElementById("analyzer-content");
            if (!text) return;

            let tactics = [];
            const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

            // 各種戰術判定 (簡化為Regex)
            const match1 = text.match(/(別急|不要緊張|我來幫|放心|別擔心|保證|協助您|很快就好)/);
            if (match1) tactics.push({ level: "warning", html: `<strong>🎭【假同理心/卸除防備】</strong><br><span style="color:#64748B;">「${match1[0]}」試圖安撫您的防備心，經典的『好人』話術！</span>` });

            const match2 = text.match(/(限時|最後|馬上|快點|錯過|名額有限|截止)/);
            if (match2) tactics.push({ level: "danger", html: `<strong>⏳【時間壓力/恐懼錯失】</strong><br><span style="color:#64748B;">使用「${match2[0]}」製造急迫感，逼迫您放棄思考直接答應。</span>` });

            const match3 = text.match(/(先匯|轉帳|保證金|手續費|驗證身分|解除分期|提供帳號)/);
            if (match3) tactics.push({ level: "danger", html: `<strong>🚨【核心詐騙指令/金流要求】</strong><br><span style="color:#64748B;">極度危險！對方提到「${match3[0]}」，這是所有詐騙的最終目的。</span>` });

            const match4 = text.match(/(經理|警察|主任|教授|法院|銀行客服)/);
            if (match4) tactics.push({ level: "warning", html: `<strong>👮【權威借用/身分偽裝】</strong><br><span style="color:#64748B;">偽裝成「${match4[0]}」等權威角色，利用服從權威的心理施壓。</span>` });

            const match5 = text.match(/(保證獲利|高報酬|穩賺|被動收入|內部消息|財富自由)/);
            if (match5) tactics.push({ level: "danger", html: `<strong>💰【FOMO 貪婪誘惑】</strong><br><span style="color:#64748B;">投資群組最愛用「${match5[0]}」，畫大餅誘使你投入本金！</span>` });

            const match6 = text.match(/(拜託|幫忙|年輕人|上進心|差一組|領死薪水)/);
            if (match6) tactics.push({ level: "warning", html: `<strong>😈【PUA 情緒勒索】</strong><br><span style="color:#64748B;">情緒綁架！對方用「${match6[0]}」讓你覺得不配合就是你的錯。</span>` });

            if (tactics.length > 0) {
                const highestLevel = tactics.some(t => t.level === "danger") ? "danger" : "warning";

                if (applyGameplay) {
                    if (highestLevel === "danger") {
                        takeDamage(Math.floor(Math.random() * 10) + 15); // 扣 15~24
                    } else {
                        takeDamage(Math.floor(Math.random() * 5) + 10);  // 扣 10~14
                    }
                }

                // 最多顯示前2個避免畫面過滿
                const displayTactics = tactics.slice(0, 2).map(t => `<div>${t.html}</div>`).join('<hr style="border-color:rgba(0,0,0,0.05); margin:10px 0;">');
                const icon = highestLevel === "danger" ? "fa-triangle-exclamation fa-beat" : "fa-lightbulb fa-shake";

                analyzer.className = `analyzer-content alert-${highestLevel}`;
                analyzer.innerHTML = `<i class="fa-solid ${icon}" style="font-size:1.5rem; margin-right:12px; margin-top:5px; height:max-content;"></i>
                                      <div style="flex:1;"><strong>🎯 本句蘊含戰術破解：</strong><br><div style="margin-top:6px;">${displayTactics}</div></div>`;

                setTimeout(() => {
                    if (!gameOver) {
                        analyzer.className = "analyzer-content scanning";
                        analyzer.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 監聽敵方程式中... 尚未發現新話術。`;
                    }
                }, 10000);
            }
        }
    </script>
